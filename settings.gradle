buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.76.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'safe-thread-local-random-root'

include 'safe-thread-local-random'
